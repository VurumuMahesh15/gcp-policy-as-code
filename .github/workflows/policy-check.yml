name: Policy Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy-check:
    name: Terraform + OPA + Conftest + Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Set up OPA + Conftest
        run: |
          curl -L -o /tmp/opa https://openpolicyagent.org/downloads/v1.19.0/opa_linux_amd64_static
          chmod +x /tmp/opa && sudo mv /tmp/opa /usr/local/bin/opa
          curl -L -o /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.69.0/conftest_0.69.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Trivy - Terraform misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" > terraform/terraform-key.json
          terraform -chdir=terraform init

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: OPA check
        run: opa check policies/

      - name: OPA test
        run: opa test policies/ -v

      - name: Conftest - policy gate
        run: conftest test terraform/ --policy policies/

      - name: Conftest - regenerated plan fixture
        env:
          TF_VAR_master_authorized_cidr: 0.0.0.0/0
        run: |
          terraform -chdir=terraform plan -out=tfplan.binary
          terraform -chdir=terraform show -json tfplan.binary > policies/tfplan.json
          conftest test policies/tfplan.json --policy policies/
