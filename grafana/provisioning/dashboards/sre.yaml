apiVersion: 1

# Dashboard provider: loads the SRE dashboard JSON into Grafana at startup.
providers:
  - name: sre-dashboards
    orgId: 1
    folder: SRE
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
